services:
  # ── Shared infrastructure ────────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${DB_NAME:-mydb}
      POSTGRES_USER: ${DB_USER:-user}
      # SÉCURITÉ : le mot de passe vient du .env (aucune valeur par défaut). Le conteneur
      # refuse de démarrer si DB_PASSWORD n'est pas défini.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant — définissez-le dans .env (openssl rand -hex 24)}
    volumes:
      - ./db_data:/var/lib/postgresql/data/
    # SÉCURITÉ : la base n'est PAS publiée sur l'hôte — elle n'est joignable que par les
    # services du réseau Docker interne. Pour un accès local ponctuel (debug), décommentez
    # en liant explicitement à la loopback : "127.0.0.1:5432:5432".
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis-db:
    image: redis:alpine
    restart: always
    # SÉCURITÉ : Redis exige désormais un mot de passe (requirepass). Redis porte la file
    # de tâches S3, la révocation de tokens et le rate-limiting : un accès non authentifié
    # permettrait d'injecter des tâches ou de contourner ces protections.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant — définissez-le dans .env (openssl rand -hex 24)}", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    # SÉCURITÉ : port non publié sur l'hôte (accès interne uniquement).
    # ports:
    #   - "127.0.0.1:6379:6379"

  # ── Backend ──────────────────────────────────────────────────────────────────
  # Stockage S3 par défaut : externe (OVH Object Storage, AWS S3, Scaleway, R2...),
  # configuré uniquement via S3_ENDPOINT/S3_BUCKET/S3_REGION/S3_ACCESS_KEY/S3_SECRET_KEY
  # dans .env. Pour un stockage 100% local et self-hosted (Garage), voir
  # docker-compose.garage.yml — il ajoute les services Garage et bascule ces
  # variables automatiquement, sans toucher à ce fichier.

  backend:
    # Image publiée par la pipeline "Kagibi Release" (.github/workflows/release.yml),
    # signée avec cosign. KAGIBI_VERSION vaut "latest" par défaut pour simplifier une
    # première installation, mais pour un déploiement en production, épinglez une
    # version précise dans .env (ex: KAGIBI_VERSION=v2.31.0) et ne la changez que
    # volontairement lors d'une mise à jour maîtrisée (voir doc self-hosting).
    # Pour builder depuis les sources à la place (audit du code avant compilation),
    # remplacez cette ligne par : build: { context: ./backend }
    image: ghcr.io/bunnntyyy/kagibi-backend:${KAGIBI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - db
      - redis-db
    env_file:
      - .env
    environment:
      # Même variable que le tag d'image ci-dessus : le backend trace cette version dans
      # schema_migrations (voir backend/pkg/migrate.go) pour savoir depuis quelle release
      # chaque étape de migration a tourné en dernier.
      KAGIBI_VERSION: ${KAGIBI_VERSION:-latest}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      DATABASE_URL: postgres://${DB_USER:-user}:${DB_PASSWORD}@db:5432/${DB_NAME:-mydb}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-db:6379
      # SÉCURITÉ : secrets obligatoires, sans valeur par défaut. Le déploiement échoue
      # explicitement si l'un d'eux est absent (plutôt que d'utiliser un secret public).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant — générez-le avec openssl rand -hex 32}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?EMAIL_ENCRYPTION_KEY manquant — générez-le avec openssl rand -hex 32}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    # Même image pour tous les déploiements : la config (API URL, provider d'auth...)
    # est injectée au démarrage du conteneur via les variables ci-dessous, pas figée au
    # build. Voir la note KAGIBI_VERSION sur le service "backend" ci-dessus.
    image: ghcr.io/bunnntyyy/kagibi-frontend:${KAGIBI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    # SÉCURITÉ : le frontend ne reçoit QUE les variables publiques nécessaires à la
    # génération de config.js (plus de env_file: .env, qui exposait JWT_SECRET, les
    # identifiants DB et les clés S3 dans un conteneur qui n'en a aucun besoin).
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
      VITE_AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_BUY_ME_A_COFFEE_URL: ${VITE_BUY_ME_A_COFFEE_URL:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
