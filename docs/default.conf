server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — static docs site, no API calls, no user input.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src needs 'unsafe-inline': VitePress injects small inline bootstrap
    # scripts (dark-mode-before-paint, OS detection, page hash map for client-side
    # routing) that a strict 'self'-only script-src silently blocks, breaking the
    # site's JS interactivity (sidebar toggle, search, theme switch, navigation).
    # Low-risk here specifically: this is a static docs site with no user input
    # and nothing dynamic to inject through, unlike the main app's frontend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cache static assets (VitePress fingerprints them, safe to cache long-term)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # VitePress builds with cleanUrls: true — "/self-hosting" maps to the file
    # "self-hosting.html" on disk, hence the .html fallback below.
    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
