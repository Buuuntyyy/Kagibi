# =================================
# 100% local, self-hosted storage (Garage), as an alternative to external S3.
#
# Usage: add this file on top of the base docker-compose.yaml —
#   docker compose -f docker-compose.yaml -f docker-compose.garage.yml up -d --build
#
# One-time setup before the first start:
#   cp garage/garage.toml.example garage/garage.toml   # then paste 2 secrets into it (see the file)
#   mkdir -p garage/credentials && touch garage/credentials/s3.env
#
# S3 credentials (S3_ACCESS_KEY/S3_SECRET_KEY) are generated automatically by
# the garage service itself on first start (see garage/entrypoint.sh) — no need
# to fill them in .env, they're ignored (this file overrides them for the backend).
#
# Bootstrap (layout/bucket/key) runs INSIDE the same container as the server —
# not a separate "garage-init" container. A separate container would need to
# reach this node over RPC to run those commands, which requires knowing the
# node's RPC identity first; with db_engine=sqlite that identity isn't readable
# from a file before the server computes it, so a separate container can't get
# started at all. Running everything locally sidesteps the problem entirely.
#
# IMPORTANT — GARAGE_PUBLIC_ENDPOINT (required in .env):
# the backend generates presigned URLs that the BROWSER uses to upload/download
# directly, without going through the backend. "http://garage:3900" (the internal
# Docker service name) would only be reachable from other containers, never from
# the browser — hence the need to publish the S3 port on the host (below) and
# provide an address the browser can actually reach: your NAS's LAN IP
# (http://192.168.1.50:3900) or a domain behind a TLS reverse proxy
# (https://s3.your-domain.example).
# =================================

services:
  garage:
    build:
      context: ./garage
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
    environment:
      GARAGE_BUCKET: ${GARAGE_BUCKET:-kagibi}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME:-kagibi-key}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-10G}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./garage/meta:/var/lib/garage/meta
      - ./garage/data:/var/lib/garage/data
      - ./garage/credentials:/credentials
    healthcheck:
      # "Healthy" = bootstrap has actually finished and credentials exist — not
      # just "the process is up". backend's depends_on below relies on this.
      test: ["CMD-SHELL", "test -s /credentials/s3.env"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 5s

  backend:
    depends_on:
      garage:
        condition: service_healthy
    env_file:
      # Layered on top of the base file's ".env" — overrides S3_ACCESS_KEY/
      # S3_SECRET_KEY if those variables are still set there for another provider.
      - ./garage/credentials/s3.env
    environment:
      # Address reachable by the BROWSER (see note above) — not the internal
      # Docker service name. No default value: depends on the user's network: a
      # wrong value here silently breaks uploads/downloads on the browser side.
      S3_ENDPOINT: "${GARAGE_PUBLIC_ENDPOINT:?GARAGE_PUBLIC_ENDPOINT missing in .env - the address by which the browser reaches Garage, e.g. http://192.168.1.50:3900}"
      S3_REGION: ${GARAGE_S3_REGION:-garage}
      S3_BUCKET: ${GARAGE_BUCKET:-kagibi}
